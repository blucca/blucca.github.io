<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
<title id="title">Capture Loop — two visual tools, one retained evidence chain</title>
<desc id="desc">The station retains a full-label original. A native model tool invokes OpenCV 5 in private AWS Lambda for page geometry, focus and perspective. A reviewer selects a target field and uploads a detail alongside that context. A second native tool runs OpenCV 5 feature registration on the station, checks coverage and source-pixel sampling, and returns measurements. The agent requests a new photograph or prepares review through executable checks. The reviewer supplies the field value. Originals, crops, requests, tools and confirmation remain in one export.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#234cdb"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20221d}.tag{font-size:13px;letter-spacing:.6px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#565b51}.arrow{fill:none;stroke:#234cdb;stroke-width:3;marker-end:url(#arrow)}.box{fill:#fffef7;stroke:#20221d;stroke-width:2}</style></defs>
<rect width="1280" height="860" fill="#e9eae3"/><rect width="1280" height="96" fill="#20221d"/>
<text x="44" y="36" class="tag" style="fill:#e4f25d">DOCKPROOF / CAPTURE LOOP</text><text x="44" y="73" class="head" style="fill:#fffef7">Keep the context. Ask for the detail. Link the field.</text>
<rect class="box" x="44" y="145" width="252" height="163"/><text class="tag" x="62" y="172">01 / BROWSER</text><text class="head" x="62" y="212">Full-label photo</text><text class="body" x="62" y="248">JPEG / PNG original</text><text class="small" x="62" y="281">POST /api/capture</text>
<path class="arrow" d="M296 224H331"/>
<rect class="box" x="342" y="145" width="240" height="163"/><text class="tag" x="360" y="172">02 / STATION</text><text class="head" x="360" y="212">Retain + route</text><text class="body" x="360" y="248">Private browser session</text><text class="small" x="360" y="281">Original + previous request</text>
<path class="arrow" d="M582 224H614"/>
<rect x="624" y="145" width="292" height="163" fill="#e4f25d" stroke="#20221d" stroke-width="2"/><text class="tag" x="642" y="172">03 / NATIVE MODEL TOOLS</text><text class="head" x="642" y="212">Nemotron agent</text><text class="body" x="642" y="248">Observe → decide → act</text><text class="small" x="642" y="281">Numbers + prior requests</text>
<path class="arrow" d="M850 145V118H1097V135"/><text class="small" x="920" y="111">inspect_capture</text>
<rect class="box" x="956" y="145" width="280" height="163"/><text class="tag" x="974" y="172">PRIVATE AWS LAMBDA</text><text class="head" x="974" y="212">OpenCV 5 / page</text><text class="body" x="974" y="244">Edges + normalized focus</text><text class="body" x="974" y="273">Perspective transform</text>
<path class="arrow" d="M956 245H927"/>
<path class="arrow" d="M460 308V351"/>
<rect class="box" x="44" y="365" width="538" height="153"/><text class="tag" x="62" y="392">04 / SELECT A FIELD + ADD A DETAIL</text><text class="head" x="62" y="429">Full-label context stays selected</text><text class="body" x="62" y="465">Inverse page transform → original-pixel field crop</text><text class="small" x="62" y="495">New detail + field ID + same-document declaration + prior request</text>
<path class="arrow" d="M582 440H614"/>
<path class="arrow" d="M770 308V355"/><text class="small" x="782" y="335">inspect_field_detail</text>
<rect class="box" x="624" y="365" width="292" height="153"/><text class="tag" x="642" y="392">STATION / OPENCV 5 DETAIL</text><text class="head" x="642" y="429">Map + measure</text><text class="body" x="642" y="462">SIFT + RANSAC + coverage</text><text class="body" x="642" y="491">Target source-pixel sampling</text>
<text class="tag" x="956" y="390">OBSERVATIONS RETURN</text><text class="body" x="956" y="423">The agent selects a tool.</text><text class="body" x="956" y="453">Execution checks its</text><text class="body" x="956" y="481">visual preconditions.</text>
<path class="arrow" d="M770 518V553H311V580"/><path class="arrow" d="M770 553H966V580"/>
<rect class="box" x="44" y="590" width="538" height="126"/><text class="tag" x="62" y="618">REQUEST_RECAPTURE / REQUEST_DETAIL_RECAPTURE</text><text class="head" x="62" y="653">Ask for the next useful photograph</text><text class="body" x="62" y="688">Framing · focus · overlap · target coverage · closer detail</text>
<rect class="box" x="696" y="590" width="540" height="126"/><text class="tag" x="714" y="618">PREPARE_FIELD_REVIEW / PREPARE_DETAIL_REVIEW</text><text class="head" x="714" y="653">Compare originals. Confirm the field.</text><text class="body" x="714" y="688">Reviewer supplies value + identity + readability response</text>
<path class="arrow" d="M310 716V743"/><path class="arrow" d="M966 716V743"/>
<rect x="44" y="753" width="1192" height="73" fill="#20221d"/><text class="tag" x="64" y="778" style="fill:#e4f25d">ONE SESSION EXPORT</text><text class="body" x="64" y="807" style="fill:#fffef7">Both originals · source crops · request chain · measurements · native tool trace · separate field confirmation</text>
<text class="small" x="44" y="847">Flat-document workflow · 24-hour session files · immediate delete · executable photo limits · independently attributed source examples</text>
</svg>
