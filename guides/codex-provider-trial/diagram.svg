<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc">
<title id="title">One native trial. Your defaults stay.</title><desc id="desc">Codex loads config.toml, overlays trial.config.toml, and starts codex -p trial. Launch codex without the profile to return to normal defaults.</desc>
<rect width="600" height="440" rx="24" fill="#f7f4ed"/>
<g font-family="Arial,sans-serif" fill="#183d35">
<rect x="35" y="30" width="530" height="102" rx="14" fill="#fff" stroke="#b8c9c1"/>
<text x="60" y="70" font-family="monospace" font-size="26" font-weight="bold">config.toml</text>
<text x="60" y="103" font-size="20">MCP · trusted projects · preferences</text>
<text x="300" y="168" text-anchor="middle" font-size="30">+</text>
<rect x="35" y="190" width="530" height="102" rx="14" fill="#e5f0e9" stroke="#82a99a"/>
<text x="60" y="230" font-family="monospace" font-size="26" font-weight="bold">trial.config.toml</text>
<text x="60" y="263" font-size="20">Endpoint · model · env_key</text>
<text x="60" y="342" font-family="monospace" font-size="29" font-weight="bold">→ codex -p trial</text>
<text x="60" y="384" font-family="monospace" font-size="24">→ codex to return</text>
</g></svg>